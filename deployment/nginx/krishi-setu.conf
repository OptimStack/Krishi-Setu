# ==============================================================================
# Krishi-Setu Nginx Configuration (Reverse Proxy + Static Frontend)
# Masterplan Section 7.2
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80)
# Handles direct traffic or redirects to HTTPS when Cloudflare SSL is enabled.
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name your-domain.example www.your-domain.example;

    # Maximum allowed client upload size (for crop photo grading uploads)
    client_max_body_size 16M;

    # Serve the built React SPA frontend
    root /var/www/krishi-setu/frontend/dist;
    index index.html;

    # Static frontend SPA routing fallback
    location / {
        try_files $uri /index.html;
    }

    # Reverse proxy API calls to Flask / Gunicorn WSGI server
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Serve uploaded produce photos directly from disk (bypassing Flask)
    location /uploads/ {
        alias /var/www/krishi-setu/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Optional: Redirect HTTP to HTTPS once Cloudflare SSL is fully verified
    # return 301 https://$host$request_uri;
}

